<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Sign Up</title>
    <style>
        :root {
            --bg-a: #040b1d;
            --bg-b: #0f172a;
            --bg-c: #1d4ed8;
            --cyan: #65f0ff;
            --purple: #8b5cf6;
            --pink: #ff4fd8;
            --success: #22c55e;
            --text: #edf6ff;
            --muted: rgba(240, 245, 255, 0.76);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(101, 240, 255, 0.18), transparent 24%),
                radial-gradient(circle at bottom right, rgba(255, 79, 216, 0.12), transparent 28%),
                linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
            background-size: 180% 180%;
            animation: gradientShift 16s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .signup-container {
            width: 100%;
            max-width: 420px;
            padding: 34px 28px 28px;
            border-radius: 22px;
            color: var(--text);
            background: rgba(10, 16, 28, 0.68);
            border: 1px solid rgba(101, 240, 255, 0.2);
            box-shadow:
                0 0 0 1px rgba(101, 240, 255, 0.1),
                0 0 30px rgba(101, 240, 255, 0.12),
                0 24px 50px rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        .brand-logo {
            margin-bottom: 8px;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 16px rgba(101, 240, 255, 0.5);
        }

        .brand-logo span {
            color: var(--cyan);
        }

        .subtitle {
            margin-bottom: 28px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid rgba(146, 170, 255, 0.2);
            background: rgba(255,255,255,0.03);
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input::placeholder {
            color: transparent;
        }

        .input-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(101, 240, 255, 0.14);
            background: rgba(255,255,255,0.04);
        }

        .input-group label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(224, 233, 255, 0.8);
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            transform: translateY(-50%);
            background: rgba(9, 15, 26, 0.9);
            padding: 0 6px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--cyan);
        }

        .signup-btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #06111c;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 26px rgba(101, 240, 255, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 32px rgba(139, 92, 246, 0.35);
        }

        .login-link {
            margin-top: 22px;
            color: rgba(240,245,255,0.8);
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            display: none;
            margin-top: 6px;
            color: #fca5a5;
            font-size: 0.8rem;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="brand-logo">NEXUS<span>.</span></div>
        <p class="subtitle">Create an account to unlock your potential.</p>

        <form id="signupForm">
            <div class="input-group">
                <input type="text" id="username" placeholder=" " required autocomplete="off">
                <label for="username">Full Name</label>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder=" " required autocomplete="off">
                <label for="email">Email Address</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
                <div class="error-msg" id="passwordError">Password must be at least 6 characters.</div>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="#">Log in</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const password = document.getElementById('password');
            const passwordError = document.getElementById('passwordError');
            const submitBtn = document.querySelector('.signup-btn');

            if (password.value.length < 6) {
                passwordError.style.display = 'block';
                password.style.borderColor = '#fca5a5';
                return;
            }

            passwordError.style.display = 'none';
            password.style.borderColor = 'rgba(255,255,255,0.2)';
            submitBtn.textContent = 'Creating Account...';

            setTimeout(() => {
                submitBtn.textContent = 'Account Created! 🎉';
                submitBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
                submitBtn.style.boxShadow = '0 0 30px rgba(34, 197, 94, 0.4)';

                setTimeout(() => {
                    document.getElementById('signupForm').reset();
                    submitBtn.textContent = 'Sign Up';
                    submitBtn.style.background = 'linear-gradient(135deg, var(--cyan), var(--purple))';
                    submitBtn.style.boxShadow = '0 0 26px rgba(101, 240, 255, 0.28)';
                }, 1800);
            }, 1000);
        });
    </script>
</body>
</html>
