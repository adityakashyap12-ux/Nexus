<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us - Branded Sign Up</title>
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --bg-gradient-start: #0f172a;
            --bg-gradient-mid: #1d4ed8;
            --bg-gradient-end: #f97316;
            --bg-soft: rgba(15,23,42,0.28);
            --card-border: rgba(255,255,255,0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            padding: 24px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .signup-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.2);
            padding: 34px 28px 28px;
            color: white;
            text-align: center;
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .brand-logo span {
            color: var(--primary-color);
        }

        .subtitle {
            margin-bottom: 28px;
            color: rgba(255,255,255,0.8);
            font-size: 0.94rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: transparent;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        .input-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #d9d9d9;
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 0 6px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #d8b4fe;
        }

        .signup-btn {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.35);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
        }

        .login-link {
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
        }

        .login-link a {
            color: #c4b5fd;
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            display: none;
            margin-top: 5px;
            color: #fca5a5;
            font-size: 0.8rem;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="brand-logo">NEXUS<span>.</span></div>
        <p class="subtitle">Create an account to unlock your potential.</p>

        <form id="signupForm">
            <div class="input-group">
                <input type="text" id="username" placeholder=" " required autocomplete="off">
                <label for="username">Full Name</label>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder=" " required autocomplete="off">
                <label for="email">Email Address</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
                <div class="error-msg" id="passwordError">Password must be at least 6 characters.</div>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="#">Log in</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const password = document.getElementById('password');
            const passwordError = document.getElementById('passwordError');
            const submitBtn = document.querySelector('.signup-btn');

            if (password.value.length < 6) {
                passwordError.style.display = 'block';
                password.style.borderColor = '#fca5a5';
                return;
            }

            passwordError.style.display = 'none';
            password.style.borderColor = 'rgba(255,255,255,0.2)';
            submitBtn.textContent = 'Creating Account...';

            setTimeout(() => {
                submitBtn.textContent = 'Account Created! 🎉';
                submitBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';

                setTimeout(() => {
                    document.getElementById('signupForm').reset();
                    submitBtn.textContent = 'Sign Up';
                    submitBtn.style.background = 'linear-gradient(135deg, var(--primary-color), var(--primary-hover))';
                }, 1800);
            }, 1000);
        });
    </script>
</body>
</html>
