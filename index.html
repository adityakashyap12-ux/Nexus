<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us - Branded Sign Up</title>
    <style>
        /* CSS Styles */
        :root {
            --primary-color: #6c63ff;
            --primary-hover: #5750d1;
            --text-color: #333;
            --bg-gradient-start: #1a2a6c;
            --bg-gradient-mid: #b21f1f;
            --bg-gradient-end: #fdbb2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .brand-logo span {
            color: var(--primary-color);
        }

        .subtitle {
            font-size: 0.9rem;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #ccc;
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        /* Floating label effect */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 0.8rem;
            background: var(--bg-gradient-start);
            padding: 0 5px;
            border-radius: 4px;
            color: var(--primary-color);
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background-color: var(--primary-hover);
        }

        .login-link {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-logo">NEXUS<span>.</span></div>
        <p class="subtitle">Create an account to unlock your potential.</p>

        <form id="signupForm">
            <div class="input-group">
                <!-- placeholder=" " is needed for the CSS floating label hack -->
                <input type="text" id="username" placeholder=" " required autocomplete="off">
                <label for="username">Full Name</label>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder=" " required autocomplete="off">
                <label for="email">Email Address</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
                <div class="error-msg" id="passwordError">Password must be at least 6 characters.</div>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="#">Log in</a>
        </div>
    </div>

    <script>
        // JavaScript Validation and Interaction
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent page reload

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordError = document.getElementById('passwordError');

            let isValid = true;

            // Simple Password Validation
            if (password.length < 6) {
                passwordError.style.display = 'block';
                document.getElementById('password').style.borderColor = '#ff4d4d';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
                document.getElementById('password').style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }

            if (isValid) {
                // Here you would normally send the data to your backend
                const submitBtn = document.querySelector('.signup-btn');
                submitBtn.innerHTML = 'Creating Account...';
                submitBtn.style.opacity = '0.8';

                // Simulate an API call
                setTimeout(() => {
                    submitBtn.innerHTML = 'Account Created! 🎉';
                    submitBtn.style.backgroundColor = '#2ecc71';
                    
                    // Reset form after 2 seconds
                    setTimeout(() => {
                        document.getElementById('signupForm').reset();
                        submitBtn.innerHTML = 'Sign Up';
                        submitBtn.style.backgroundColor = 'var(--primary-color)';
                        submitBtn.style.opacity = '1';
                    }, 2000);
                }, 1500);
            }
        });
    </script>
</body>
</html>

</body>
</html>
