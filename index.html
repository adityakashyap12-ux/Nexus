<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus | Launch Your Future</title>
  <style>
    :root {
      --bg-1: #020408;
      --bg-2: #080e1b;
      --bg-3: #0d1a2e;
      --cyan: #00ffff;
      --cyan-bright: #00f7ff;
      --purple: #a855f7;
      --purple-bright: #d946ef;
      --pink: #ff006e;
      --pink-bright: #ff1493;
      --lime: #00ff00;
      --text: #f0f9ff;
      --text-secondary: #cbd5e1;
      --line: rgba(0, 255, 255, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.25), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.2), transparent 40%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      overflow-x: hidden;
    }

    .grid-glow {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
      pointer-events: none;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1280px, 100%);
      min-height: 760px;
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      background: rgba(5, 10, 20, 0.65);
      border: 2px solid var(--line);
      border-radius: 32px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 255, 255, 0.2),
        0 0 40px rgba(0, 255, 255, 0.2),
        0 0 80px rgba(168, 85, 247, 0.15),
        0 40px 100px rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .hero {
      position: relative;
      padding: 72px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, rgba(0,255,255,0.06), rgba(168,85,247,0.06));
    }

    .corner-orb-1 {
      position: absolute;
      right: -120px;
      top: -120px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,255,0.35), rgba(0,255,255,0.08) 55%, transparent 70%);
      filter: blur(20px);
      pointer-events: none;
    }

    .corner-orb-2 {
      position: absolute;
      left: -100px;
      bottom: -100px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.3), rgba(168,85,247,0.05) 55%, transparent 70%);
      filter: blur(18px);
      pointer-events: none;
    }

    .eyebrow {
      width: fit-content;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 255, 255, 0.12);
      border: 1.5px solid var(--cyan);
      color: var(--cyan-bright);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.1);
    }

    h1 {
      margin: 24px 0 18px;
      font-size: clamp(3rem, 5vw, 5.5rem);
      line-height: 0.96;
      letter-spacing: -0.07em;
      font-weight: 900;
      text-shadow: 
        0 0 20px rgba(0, 255, 255, 0.4),
        0 0 40px rgba(0, 255, 255, 0.2);
    }

    h1 .highlight {
      background: linear-gradient(90deg, var(--cyan-bright), var(--purple-bright), var(--pink-bright));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
    }

    .hero-copy {
      max-width: 570px;
      color: var(--text-secondary);
      font-size: 1.1rem;
      line-height: 1.8;
      margin: 0 0 28px;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 16px 26px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 0.03em;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border 0.25s ease;
      font-size: 1rem;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--cyan-bright));
      color: #000;
      border: 2px solid var(--cyan-bright);
      box-shadow: 
        0 0 30px rgba(0, 255, 255, 0.4),
        0 0 60px rgba(0, 255, 255, 0.25),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .btn-primary:hover {
      box-shadow: 
        0 0 40px rgba(0, 255, 255, 0.6),
        0 0 80px rgba(0, 255, 255, 0.35),
        inset 0 0 30px rgba(255, 255, 255, 0.2);
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(0, 255, 255, 0.4);
      color: var(--cyan-bright);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(0, 255, 255, 0.1);
      border-color: var(--cyan-bright);
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.35);
    }

    .right-panel {
      position: relative;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 15, 0.7);
      border-left: 2px solid var(--line);
    }

    .right-panel::before {
      content: "";
      position: absolute;
      inset: 16px 12px 16px 0;
      background: linear-gradient(180deg, rgba(0,255,255,0.15), transparent);
      border-radius: 24px;
      pointer-events: none;
    }

    .signup-wrap {
      position: relative;
      z-index: 1;
      width: min(420px, 100%);
      min-height: 640px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 24px;
      background: rgba(5, 10, 20, 0.8);
      box-shadow: 
        0 0 30px rgba(0, 255, 255, 0.18),
        0 0 60px rgba(168, 85, 247, 0.1);
    }

    .signup-wrap iframe {
      width: 100%;
      min-height: 610px;
      border: 0;
      border-radius: 18px;
      background: transparent;
      display: block;
    }

    @media (max-width: 980px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .right-panel {
        border-left: none;
        border-top: 2px solid var(--line);
      }
    }

    @media (max-width: 560px) {
      body { padding: 18px; }
      .hero { padding: 42px 24px; }
      .cta-row { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="grid-glow"></div>

  <div class="app-shell">
    <section class="hero">
      <div class="corner-orb-1"></div>
      <div class="corner-orb-2"></div>
      <div class="eyebrow">✨ Nexus OS</div>
      <h1>Build<br><span class="highlight">Tomorrow</span></h1>
      <p class="hero-copy">
        Launch faster, connect deeper, and turn ambitious ideas into real momentum with a platform built for creators, teams, and future thinkers.
      </p>
      <div class="cta-row">
        <a class="btn btn-primary" href="signup.html">⚡ Create Account</a>
        <a class="btn btn-secondary" href="about.html">🚀 View Platform</a>
      </div>
    </section>

    <aside class="right-panel">
      <div class="signup-wrap">
        <iframe src="signup.html" title="Nexus sign up form"></iframe>
      </div>
    </aside>
  </div>
</body>
</html>
